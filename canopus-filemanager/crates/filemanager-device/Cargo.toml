[package]
name = "canopus-filemanager-device"
description = "Target-selectable Canopus file manager native module (Band 9 Pro 3.1.175)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
default = []
device = ["dep:canopus-target-private"]
target-xiaomi-band-9-pro-3-1-175 = [
    "device",
    "canopus-target-private/target-xiaomi-band-9-pro-3-1-175",
]

[dependencies]
canopus-abi = { path = "../../../Canopus/sdk/rust/canopus-abi" }
canopus-runtime = { path = "../../../Canopus/sdk/rust/canopus-runtime" }
# Target-selectable full-trust facade; target features select the exact backend
# containing recovered firmware addresses.
canopus-target-private = { path = "../../../Canopus/sdk/rust/canopus-target-private", optional = true, default-features = false }
